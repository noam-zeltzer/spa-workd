<style>
/* Layout: a screening room. The 16:9 reel sits centred on a dark stage, a quiet transport bar under it,
   and the reel's glossary (one chapter per term) as an index you can jump through. Single dark look by choice. */
:root {
  --stage: #08070F;
  --panel: #13112A;
  --line: #2B2750;
  --fg: #F3EEE6;
  --muted: #9F99C4;
  --accent: #FF9A62;
  --ultra: #3D35FF;
  --f-display: "Archivo", "Arial Black", system-ui, sans-serif;
  --f-serif: "Instrument Serif", Georgia, "Times New Roman", serif;
  --f-mono: "Martian Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--stage);
  color: var(--fg);
  font-family: var(--f-mono);
  font-size: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1280px; margin: 0 auto; padding-block: 20px 28px; display: grid; gap: 14px; }
.top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.top b { font-family: var(--f-display); font-stretch: 125%; font-weight: 900; font-size: 15px; letter-spacing: .04em; color: var(--fg); }
.top em { font-family: var(--f-serif); font-style: italic; font-size: 16px; letter-spacing: 0; text-transform: none; color: var(--fg); }
.screen { position: relative; aspect-ratio: 16 / 9; max-width: 100%; background: #100E1F; border-radius: 6px; overflow: hidden; box-shadow: 0 30px 80px -30px rgba(61, 53, 255, .45); }
.screen canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.big-play {
  position: absolute; left: 50%; bottom: 9%; transform: translateX(-50%);
  display: inline-flex; align-items: center; gap: 12px; padding: 14px 22px 14px 18px; border: 0; border-radius: 999px;
  background: var(--fg); color: #100E1F; font: 600 13px/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; cursor: pointer;
  box-shadow: 0 10px 40px rgba(0,0,0,.35);
}
.big-play svg { width: 14px; height: 14px; }
.big-play small { font: italic 400 16px/1 var(--f-serif); letter-spacing: 0; text-transform: none; color: #3D35FF; }
.big-play:hover { background: var(--accent); }
@media (max-width: 560px) {
  .big-play { bottom: 50%; transform: translate(-50%, 50%); padding: 10px 14px 10px 12px; gap: 8px; font-size: 10px; white-space: nowrap; }
  .big-play small { font-size: 13px; }
}
.big-play:focus-visible, .transport button:focus-visible, .glossary button:focus-visible, #scrub:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.transport { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.transport button { background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 999px; padding: 9px 14px; font: 500 11px/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; cursor: pointer; }
.transport button:hover { border-color: var(--muted); }
.tc { font-variant-numeric: tabular-nums; color: var(--fg); letter-spacing: .06em; min-width: 11ch; }
.scrub { position: relative; flex: 1 1 260px; min-width: 0; height: 28px; display: flex; align-items: center; }
#scrub { width: 100%; accent-color: var(--accent); margin: 0; }
.glossary { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.glossary button { width: 100%; text-align: left; display: grid; grid-template-columns: 2.6ch 1fr auto; gap: 8px; align-items: baseline; background: transparent; color: var(--muted); border: 0; border-top: 1px solid var(--line); padding: 9px 2px 4px; font: 500 11px/1.2 var(--f-mono); letter-spacing: .08em; cursor: pointer; }
.glossary button span:nth-child(2) { color: var(--fg); font-family: var(--f-display); font-weight: 800; font-stretch: 112%; letter-spacing: .02em; font-size: 12px; }
.glossary button.on { border-top-color: var(--accent); color: var(--accent); }
.glossary button:hover span:nth-child(2) { color: var(--accent); }
.note { color: var(--muted); line-height: 1.6; max-width: 70ch; }
.note i { font-family: var(--f-serif); font-size: 15px; color: var(--fg); }
/* Offline render: the canvas alone, at exactly 1920 x 1080. */
body.render { padding: 0; margin: 0; background: #000; overflow: hidden; }
body.render .wrap { display: block; max-width: none; padding: 0; }
body.render .wrap > :not(.screen) { display: none; }
body.render .screen { width: 1920px; height: 1080px; border-radius: 0; box-shadow: none; aspect-ratio: auto; }
body.render .big-play { display: none; }
@media (prefers-reduced-motion: reduce) { .big-play { transition: none; } }
</style>

/* ============================================================ 05 EXTRUDE + 06 CLONER  4.00 – 8.00 */
function worldCam(t) {

/* ============================================================ 07 PARALLAX  8.00 – 9.00 */

/* ============================================================ 08 MORPH  9.00 – 10.00 */

}

/* ============================================================ 09 LOOP  10.00 – 11.50 */
function sLoop(ctx, t) {
  const inv = [[10.5, 10.55], [11.0, 11.05], [11.25, 11.29], [11.375, 11.41]].some(([a, b]) => t >= a && t < b);

  const travel = u * .95 + 2.4 * Math.pow(prog(t, 10.55, 11.5), 3);

  const fm = { family: 'mono', weight: 700, size: 30, ls: 8 };
  for (let m = m0 + 30; m >= m0; m--) {
    const z = m * dz - travel;

    const s = 1 / z, half = 760 * s;
    const a = clamp((8 - z) / 3) * clamp((z - near) / .12);

    ctx.save(); ctx.translate(W / 2, H / 2); ctx.rotate(m * .11 + twist);
    ctx.globalAlpha = a;
    const col = fg || cols[((m % 6) + 6) % 6];
    ctx.strokeStyle = col;
    const thick = m % 3 === 0;

        text(ctx, fm, 'LOOP  ·  LOOP  ·  LOOP  ·  LOOP  ·  LOOP', 0, 0, 'center', col);
        ctx.restore();
      }

    ctx.restore();

  ctx.restore();

}

/* ============================================================ 10 TIMING (blitz)  11.50 – 12.50 */

  } else if (b.k === 'track') {
    const ls = 4 + E.outExpo(u) * 70;
    text(ctx, { family: 'display', weight: 300, stretch: 'expanded', size: 160, ls }, b.w, ls / 2, 58, 'center', b.fg);
    ctx.fillStyle = C.apricot; const wdt = 200 + E.outExpo(u) * 900; ctx.fillRect(-wdt / 2, 110, wdt, 4);
  } else if (b.k === 'weight') {
    const wg = Math.round(lerp(100, 900, E.outCubic(u)));
    text(ctx, { family: 'display', weight: wg, stretch: 'expanded', size: 250 }, b.w, 0, 90, 'center', b.fg);
    text(ctx, { family: 'mono', weight: 600, size: 16, ls: 3 }, `WGHT ${wg}`, 0, 170, 'center', b.fg);
  } else if (b.k === 'stack') {
    for (let r = -3; r <= 3; r++) {
      const f = { family: 'display', weight: 900, stretch: 'condensed', size: 190, ls: 0 };
      setFont(ctx, f); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      const x = (r % 2 ? 1 : -1) * (u * 160) + r * 60;
      if (r % 2) { ctx.strokeStyle = b.fg; ctx.lineWidth = 3; ctx.strokeText(b.w + '  ' + b.w + '  ' + b.w, x, r * 160); }
      else { ctx.fillStyle = r === 0 ? C.apricot : b.fg; ctx.fillText(b.w + '  ' + b.w + '  ' + b.w, x, r * 160); }
    }
  } else if (b.k === 'stretch') {
    ctx.scale(lerp(1.7, 2.3, u), 1);
    text(ctx, { family: 'display', weight: 900, stretch: 'condensed', size: 360 }, b.w, 0, 130, 'center', b.fg);
  } else if (b.k === 'tiny') {
    text(ctx, { family: 'serif', weight: 400, style: 'italic', size: 72 }, b.w, 0, 22, 'center', b.fg);
  } else {
    text(ctx, { family: 'display', weight: 900, stretch: 'expanded', size: 330, ls: -8 }, b.w, 0, 120, 'center', b.fg);
  }
  ctx.restore();
}

/* ============================================================ 11 INBETWEEN  12.50 – 15.00 */
function sLogo(ctx, t) {
  radialBg(ctx, '#1F1A55', C.ink, W / 2, H / 2, H * .95);
  const LX = 210, RX = W - 210, CY = 540;
  const merge = E.inOutExpo(prog(t, 14.42, 14.78));
  const vanish = E.inBack(prog(t, 14.76, 14.92), 2);
  // flash + shockwaves on the hit
  for (const x of [LX, RX]) {
    const p = prog(t, 12.62, 13.2);
    if (p > 0 && p < 1) { ctx.strokeStyle = rgba(C.lilac, (1 - p) * .8); ctx.lineWidth = 3 * (1 - p) + .5; diamondPath(ctx, x, CY, 70 + E.outExpo(p) * 420); ctx.stroke(); }
  }
  // timeline between the keys
  const tl = E.outExpo(prog(t, 13.1, 13.55)) * (1 - E.inExpo(prog(t, 14.38, 14.66)));
  const ty = 662;
  if (tl > 0) {
    const half = (RX - LX - 140) / 2 * tl;
    ctx.fillStyle = rgba(C.bone, .55); ctx.fillRect(W / 2 - half, ty - 1, half * 2, 2);
    for (let x = LX + 70; x <= RX - 70; x += 23.6) {
      if (Math.abs(x - W / 2) > half) continue;
      const k = Math.round((x - LX - 70) / 23.6);
      ctx.fillStyle = rgba(C.bone, k % 10 === 0 ? .7 : .28); ctx.fillRect(x - .75, ty + 6, 1.5, k % 10 === 0 ? 14 : 6);
    }
  }
  // playhead sweep
  const ps = prog(t, 13.32, 13.95), phx = lerp(LX + 70, RX - 70, E.inOutCubic(ps));
  // the word, tweened out of the left key
  const f = { family: 'display', weight: 900, stretch: 'expanded', size: 148, ls: -2 };
  const word = 'INBETWEEN';
  const Lw = layout(ctx, f, word);
  const x0 = W / 2 - Lw.width / 2;
  letters(ctx, f, word, W / 2, CY + 54, 'center', (i, n, lx, w) => {
    const st = 12.6 + i * .05, pos = tt => EZ(prog(tt, st, st + .55));
    const p = pos(t);
    const out = E.inExpo(prog(t, 14.4 + Math.abs(i - 4) * .025, 14.66 + Math.abs(i - 4) * .025));
    const homeX = lx + w / 2, fromX = LX;
    const dxIn = (fromX - homeX) * (1 - p), dxOut = (W / 2 - homeX) * out;
    for (let k = 6; k >= 1; k--) {
      const pk = pos(t - k / 30); if (pk <= 0 || Math.abs(pk - p) < .004) continue;
      const sk = lerp(.15, 1, Math.min(1, pk * 1.6));
      ctx.save(); ctx.translate(homeX + (fromX - homeX) * (1 - pk), CY + 54 - Lw.cap / 2); ctx.scale(sk, sk);
      ctx.globalAlpha *= .5 * (1 - k / 7);
      ctx.strokeStyle = C.lilac; ctx.lineWidth = 2 / sk; ctx.strokeText(word[i], -w / 2, Lw.cap / 2); ctx.restore();
    }
    if (p <= 0) return null;
    const sc = lerp(.15, 1, Math.min(1, p * 1.6)) * (1 - out);
    const glow = ps > 0 && ps < 1 ? clamp(1 - Math.abs(phx - (homeX)) / 120) : 0;
    return { x: dxIn + dxOut, sx: sc, sy: sc, fill: glow > 0 ? mix(C.bone, C.apricot, glow) : C.bone };
  });
  if (ps > 0 && ps < 1) {
    ctx.fillStyle = C.apricot; ctx.fillRect(phx - 1, CY - 110, 2, ty - CY + 140);
    diamondPath(ctx, phx, CY - 116, 7); ctx.fill();
  }
  // tagline
  const ta = 1 - prog(t, 14.3, 14.5);
  if (ta > 0) {
    ctx.save(); ctx.globalAlpha = ta;
    ctx.beginPath(); ctx.rect(0, 690, W, 120); ctx.clip();
    const words = ['we', 'live', 'between', 'the', 'keyframes.'];
    const fT = { family: 'serif', weight: 400, style: 'italic', size: 60, ls: 0 };
    setFont(ctx, fT); const full = ctx.measureText(words.join(' ')).width; let x = W / 2 - full / 2;
    words.forEach((wd, k) => {
      const q = E.outExpo(prog(t, 13.42 + k * .06, 13.95 + k * .06));
      setFont(ctx, fT); const wW = ctx.measureText(wd + ' ').width;
      text(ctx, fT, wd, x, 772 + (1 - q) * 90, 'left', wd === 'between' ? C.apricot : C.bone);
      x += wW;
    });
    ctx.restore();
    text(ctx, { family: 'mono', weight: 500, size: 14, ls: 4 }, scramble('MOTION REEL 2026  ·  DIRECTION  ·  DESIGN  ·  3D  ·  TYPE', t, 13.6, .005, 12), W / 2, 838, 'center', rgba(C.lilac, .9 * ta * prog(t, 13.55, 13.6)));
  }
  // the two keys (3D gems): slam in from depth, merge, vanish
  const inP = E.outExpo(prog(t, 12.5, 12.78));
  const gx = d => lerp(d, W / 2, merge);
  const r = 64 * (1 - vanish);
  const z = lerp(-60, 0, inP);
  [LX, RX].forEach((x, k) => {
    const m = stage.gems[k];
    setGem(m, gx(x), CY, r, (k ? -1 : 1) * (t * 1.6 + (1 - inP) * 6), .35 * Math.sin(t * 2 + k), z);
    m.visible = t >= 12.5 && r > .5;
  });
  draw3D(ctx, stage.scene, stage.cam);
  // the last dot
  const da = prog(t, 14.8, 14.86) * (1 - prog(t, 14.9, 14.98));
  if (da > 0) { circle(ctx, W / 2, CY, 5); ctx.fillStyle = rgba(C.bone, da); ctx.fill(); }
  // hit flash
  const fl = 1 - prog(t, 12.5, 12.64);
  if (t >= 12.5 && fl > 0) { ctx.fillStyle = rgba(C.bone, .85 * fl * fl); ctx.fillRect(0, 0, W, H); }
}

/* ============================================================ timeline */
const SCENES = [
  { a: 0, b: 1.0, draw: sKeyframe },
  { a: 1.0, b: 2.03, draw: sEase },
  { a: 1.78, b: 3.0, draw: sStagger },
  { a: 3.0, b: 4.0, draw: sSquash },
  { a: 4.0, b: 8.0, draw: sWorld },
  { a: 8.0, b: 9.0, draw: sParallax },
  { a: 9.0, b: 10.0, draw: sMorph },
  { a: 10.0, b: 11.5, draw: sLoop },
  { a: 11.5, b: 12.5, draw: sBlitz },
  { a: 12.5, b: 15.01, draw: sLogo },
];
function drawFrame(ctx, t) {
  ctx.setTransform(S, 0, 0, S, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
  fillBg(ctx, C.ink);
  stage.gems.forEach(g => g.visible = false);
  for (const sc of SCENES) if (t >= sc.a && t < sc.b) { ctx.save(); sc.draw(ctx, t); ctx.restore(); }
  drawHUD(ctx, t);
}
// Shutter: 180°. Sub-frame count rises where things move fast.
const FAST = [[.7, 1.02, 10], [1.76, 2.05, 12], [2.7, 3.02, 8], [3.84, 4.02, 10], [5.4, 6.0, 5], [8.0, 8.06, 8], [8.66, 9.02, 10],
  [9.8, 10.02, 8], [10.9, 11.5, 8], [12.48, 12.8, 6], [14.38, 14.95, 8]];
function samplesAt(t) { for (const [a, b, k] of FAST) if (t >= a && t <= b) return k; return 4; }
function renderFrame(t, K) {
  K = K ?? samplesAt(t);
  if (K <= 1) drawFrame(octx, t);
  else {
    for (let s = 0; s < K; s++) {
      const ts = clamp(t + ((s + .5) / K - .5) * .5 / FPS, 0, DUR - 1e-4);
      JIT = [halton(s + 1, 2) - .5, halton(s + 1, 3) - .5];
      drawFrame(fx, ts);
      ax.setTransform(1, 0, 0, 1, 0, 0); ax.globalAlpha = 1 / (s + 1); ax.drawImage(fc, 0, 0);
    }
    JIT = null;
    octx.setTransform(1, 0, 0, 1, 0, 0); octx.globalAlpha = 1; octx.drawImage(ac, 0, 0);
  }
  // finishing: vignette + grain
  const fi = Math.round(t * FPS);
  octx.setTransform(S, 0, 0, S, 0, 0);
  octx.globalAlpha = 1; octx.fillStyle = vignette; octx.fillRect(0, 0, W, H);
  octx.save(); octx.globalCompositeOperation = 'overlay'; octx.globalAlpha = .085;
  octx.translate(-hash(fi, 1) * 256, -hash(fi, 2) * 256); octx.scale(1.4, 1.4);
  octx.fillStyle = grains[fi % grains.length]; octx.fillRect(0, 0, W, H); octx.restore();
}

/* ============================================================ boot */
async function boot() {
  const fonts = ['900 100px Archivo', '300 100px Archivo', 'italic 400 100px "Instrument Serif"', '400 100px "Instrument Serif"', '500 100px "Martian Mono"', '700 100px "Martian Mono"'];
  await Promise.all(fonts.map(f => document.fonts.load(f).catch(() => null)));
  await document.fonts.ready;
  if (!RENDER) S = pickScale();
  setupCanvases();
  init3D();
  // warm the shaders of every scene once
  for (const t of [.5, 3.3, 4.6, 6.8, 12.9]) drawFrame(fx, t);
}
function pickScale() {
  const w = Math.min(window.innerWidth, 1280) * Math.min(2, window.devicePixelRatio || 1);
  return clamp(Math.round((w / W) * 4) / 4, .5, 1);
}
const ready = boot();
window.reel = { ready, renderFrame, DUR, FPS, CHAPTERS };

if (!RENDER) ready.then(player);

/* ============================================================ player */
function player() {
  const snd = document.getElementById('snd'), playBtn = document.getElementById('play'), big = document.getElementById('bigplay');
  const scrub = document.getElementById('scrub'), tcEl = document.getElementById('tc'), soundBtn = document.getElementById('sound');
  const gl = document.getElementById('glossary');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let playing = false, t0 = 0, startAt = 0, cur = 14.24, useAudio = true, muted = false;
  CHAPTERS.forEach(([ct, name], i) => {
    const li = document.createElement('li'); const b = document.createElement('button'); b.type = 'button';
    b.innerHTML = `<span>${pad(i + 1)}</span><span>${name}</span><span>${ct.toFixed(2)}s</span>`;
    b.addEventListener('click', () => { seek(ct + .001); if (!playing) show(cur); });
    li.appendChild(b); gl.appendChild(li);
  });
  const chipEls = [...gl.querySelectorAll('button')];
  function show(t) {
    renderFrame(t, 1);
    tcEl.textContent = tcode(t);
    scrub.value = t;
    const k = chapterAt(t); chipEls.forEach((el, i) => el.classList.toggle('on', i === k));
  }
  function clock() { return useAudio && !snd.paused ? snd.currentTime : startAt + (performance.now() - t0) / 1000; }
  function frame() {
    if (!playing) return;
    cur = clock();
    if (cur >= DUR - .017) { cur = DUR - .017; show(cur); stop(); big.hidden = false; big.firstChild.nextSibling.textContent = 'Play again '; return; }
    show(cur); requestAnimationFrame(frame);
  }
  function start(from = 0) {
    cur = from; startAt = from; t0 = performance.now(); playing = true; big.hidden = true; playBtn.textContent = 'Pause';
    useAudio = false;
    if (!muted) {
      snd.currentTime = from;
      snd.play().then(() => { useAudio = true; }).catch(() => { useAudio = false; });
    }
    requestAnimationFrame(frame);
  }
  function stop() { playing = false; snd.pause(); playBtn.textContent = 'Play'; }
  function seek(t) { const was = playing; stop(); cur = clamp(t, 0, DUR - .017); show(cur); if (was) start(cur); }
  big.addEventListener('click', () => start(0));
  playBtn.addEventListener('click', () => playing ? stop() : start(cur >= DUR - .05 ? 0 : cur));
  scrub.addEventListener('input', () => { stop(); cur = +scrub.value; show(cur); big.hidden = true; });
  soundBtn.addEventListener('click', () => {
    muted = !muted; soundBtn.setAttribute('aria-pressed', String(!muted)); soundBtn.textContent = muted ? 'Sound off' : 'Sound on';
    if (muted) { if (playing) { startAt = cur; t0 = performance.now(); useAudio = false; } snd.pause(); }
    else if (playing) { snd.currentTime = cur; snd.play().then(() => { useAudio = true; }).catch(() => {}); }
  });
  window.addEventListener('keydown', e => { if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); playBtn.click(); } });
  show(cur);
  if (reduce) big.firstChild.nextSibling.textContent = 'Play the reel ';
}
</script>
