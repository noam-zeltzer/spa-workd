<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none"
     stroke-linecap="round" stroke-linejoin="round">
  <!-- spa workd: a two-seat sofa, drawn in one weight. Legs carry the wood tone. -->
  <g stroke="#4B918F" stroke-width="17">
    <!-- back cushions, rounded at the top, meeting at the middle -->
    <path d="M150 302V196a32 32 0 0 1 32-32h68a0 0 0 0 1 0 0v138"/>
    <path d="M362 302V196a32 32 0 0 0-32-32h-68v138"/>
    <!-- arms, flaring out past the back -->
    <path d="M150 224a38 38 0 0 0-38 38v58"/>
    <path d="M362 224a38 38 0 0 1 38 38v58"/>
    <!-- seat cushions, bulging gently at the top -->
    <path d="M140 348v-30q56-18 110 0v30z"/>
    <path d="M372 348v-30q-56-18-110 0v30z"/>
    <!-- base -->
    <path d="M112 306v36a48 48 0 0 0 48 48h192a48 48 0 0 0 48-48v-36"/>
  </g>
  <g stroke="#A78562" stroke-width="17">
    <path d="M172 390l-18 40"/>
    <path d="M340 390l18 40"/>
  </g>
</svg>
