<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>קרב על האי</title>
<style>
  :root { --bg:#0b0d1a; --fg:#f4f4ff; --accent:#7cff6b; --btn:#1d2140; --btn2:#2b3060; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font-family:system-ui,"Segoe UI",Arial,sans-serif; overflow:hidden; touch-action:none; }
  #wrap { display:flex; flex-direction:column; height:100%; }
  #stage { flex:1; position:relative; min-height:0; display:flex; align-items:center; justify-content:center; }
  canvas { max-width:100%; max-height:100%; display:block; background:#000; border-radius:10px; }
  #pad { display:flex; justify-content:space-between; align-items:flex-end; gap:8px; padding:8px 12px calc(10px + env(safe-area-inset-bottom)); direction:ltr; }
  .group { display:flex; gap:8px; align-items:flex-end; flex-wrap:wrap; }
  .group.right { justify-content:flex-end; max-width:60%; }
  button { font:inherit; color:var(--fg); background:var(--btn); border:2px solid #3a3f78; border-radius:14px;
           min-width:62px; height:62px; font-size:15px; font-weight:700; padding:0 8px; position:relative; overflow:hidden; touch-action:none; }
  button.on { background:var(--btn2); border-color:var(--accent); transform:scale(.95); }
  button small { display:block; font-size:10px; opacity:.7; font-weight:500; }
  button .cd { position:absolute; left:0; bottom:0; width:100%; background:rgba(0,0,0,.6); pointer-events:none; }
  #ult { border-color:#ffcf3a; }
  #ult.ready { box-shadow:0 0 14px #ffcf3a; animation:pulse 0.8s infinite alternate; }
  @keyframes pulse { to { box-shadow:0 0 26px #ff7b00; } }
  #overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
             background:rgba(5,6,15,.82); padding:20px; gap:12px; }
  #overlay h1 { margin:0; font-size:clamp(26px,6vw,46px); color:var(--accent); text-shadow:0 0 18px #2f9; }
  #overlay p { margin:0; max-width:520px; line-height:1.5; opacity:.9; }
  #overlay img { width:110px; border-radius:50%; border:4px solid #ff4d6d; box-shadow:0 0 30px #ff4d6d; animation:wob 1.2s infinite ease-in-out; }
  @keyframes wob { 50% { transform:rotate(-8deg) scale(1.08); } }
  #overlay .start { height:56px; padding:0 30px; font-size:20px; background:#ff4d6d; border-color:#ff9db0; }
  .keys { font-size:13px; opacity:.6; }
  @media (max-width:600px) { button { min-width:54px; height:54px; font-size:13px; } }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="c" width="900" height="500"></canvas>
    <div id="overlay">
      <img id="ovImg" alt="">
      <h1 id="ovTitle">קרב על האי המעופף</h1>
      <p id="ovText">בעולם ריק לגמרי מרחף אי קטן אחד. ועליו אתה.<br>ואז הוא מגיע. <b>הבוס.</b> עם הקפוצ'ון. והמבט הזה.<br>אל תיפול מהאי. תביס אותו.</p>
      <button class="start" id="startBtn">יאללה לקרב!</button>
      <div class="keys">מקלדת: ← → זזים · ↑ קפיצה · Z יריה · X דאש · C מגן · V אולטי</div>
    </div>
  </div>
  <div id="pad">
    <div class="group">
      <button data-k="left">◀</button>
      <button data-k="right">▶</button>
      <button data-k="jump">⤒<small>קפיצה</small></button>
    </div>
    <div class="group right">
      <button data-k="shoot">🔥<small>יריה</small></button>
      <button data-k="dash" id="b_dash">💨<small>דאש</small><span class="cd"></span></button>
      <button data-k="shield" id="b_shield">🛡️<small>מגן</small><span class="cd"></span></button>
      <button data-k="ult" id="ult">⚡<small>אולטי</small><span class="cd"></span></button>
    </div>
  </div>
</div>

// ---------- input ----------
const keys = {}, pressed = {};
const keyMap = { ArrowLeft:'left', a:'left', ArrowRight:'right', d:'right', ArrowUp:'jump', w:'jump', ' ':'jump',
                 z:'shoot', j:'shoot', x:'dash', k:'dash', c:'shield', l:'shield', v:'ult', ';':'ult' };
addEventListener('keydown', e => { const k = keyMap[e.key] || keyMap[e.key.toLowerCase()]; if (!k) return; e.preventDefault(); if (!keys[k]) pressed[k] = true; keys[k] = true; });
addEventListener('keyup', e => { const k = keyMap[e.key] || keyMap[e.key.toLowerCase()]; if (k) keys[k] = false; });
document.querySelectorAll('#pad button').forEach(b => {
  const k = b.dataset.k;
  const down = e => { e.preventDefault(); if (!keys[k]) pressed[k] = true; keys[k] = true; b.classList.add('on'); };
  const up = e => { e.preventDefault(); keys[k] = false; b.classList.remove('on'); };
  b.addEventListener('pointerdown', down); b.addEventListener('pointerup', up);
  b.addEventListener('pointerleave', up); b.addEventListener('pointercancel', up);
});

// ---------- world ----------
const ISLAND = { x:250, y:390, w:400 };
const PLATS = [ { x:120, y:290, w:110 }, { x:670, y:290, w:110 }, { x:390, y:230, w:120 } ];
const GRAV = 1500;
const stars = Array.from({length:120}, () => ({ x:Math.random()*W, y:Math.random()*H, s:Math.random()*1.8+.3, t:Math.random()*6 }));
const rocks = Array.from({length:6}, (_,i) => ({ x:Math.random()*W, y:60+Math.random()*380, r:6+Math.random()*14, v:8+Math.random()*16 }));

const TAUNTS = [
  'למה שלא תבין את זה לבד? 🤨', 'זה הכל? אחי...', 'אני עדיין בפוזה של האוטובוס', 'יציאת חירום? אין פה יציאה 😈',
  'הקפוצ\'ון הזה חסין אש', 'אמא שלי מרביצה יותר חזק', 'תן לי רגע, אני מסדר את השיער', 'הממ... כן. לא.',
  'אתה בטוח שאתה בצד הנכון של האי?', 'הנה, תפוס! 🫴', 'אני עושה את זה בעיניים עצומות',
];
const HURT = ['אאוץ\'!', 'הפנים! לא בפנים!', 'אחי השיער!!', 'זה לא נחשב', 'רגע רגע רגע', 'אוקיי זה כאב', 'אני מתלונן לנהג!'];

let P, B, bullets, enemyShots, minis, parts, texts, shake, state, time, slowmo, bubble, flash;

function reset() {
  P = { x:450, y:300, vx:0, vy:0, w:26, h:40, face:1, hp:100, lives:3, onGround:false, jumps:0, inv:0,
        shootCd:0, dashCd:0, dashT:0, shieldCd:0, shieldT:0, ult:0, ultT:0, squash:1, hitT:0 };
  B = { x:450, y:120, vx:0, vy:0, hp:1500, max:1500, phase:0, t:0, atk:null, atkT:0, next:2.2, rot:0, sq:1, hitT:0, tx:450, ty:120, dead:false, deathT:0, scale:1 };
  bullets = []; enemyShots = []; minis = []; parts = []; texts = [];
  shake = 0; time = 0; slowmo = 0; flash = 0;
  bubble = { text:'אה. עוד אחד. 🙄', t:2.5 };
}

function say(t, d=2.2) { bubble = { text:t, t:d }; }
const rnd = (a,b) => a + Math.random()*(b-a);
const pick = a => a[Math.floor(Math.random()*a.length)];
function burst(x,y,n,col,sp=260,life=.6,size=4) {
  for (let i=0;i<n;i++) { const a=Math.random()*Math.PI*2, s=Math.random()*sp; parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life,max:life,col,size}); }
}
function popText(x,y,t,col='#fff',size=18) { texts.push({x,y,t,col,size,life:1}); }

// ---------- player ----------
function surfaces() { return [ISLAND, ...PLATS]; }
function updatePlayer(dt) {
  const p = P;
  p.shootCd -= dt; p.dashCd -= dt; p.shieldCd -= dt; p.inv -= dt; p.hitT -= dt;
  if (p.shieldT > 0) p.shieldT -= dt;
  const speed = 300;
  let dir = (keys.right?1:0) - (keys.left?1:0);
  if (dir) p.face = dir;
  if (p.dashT > 0) {
    p.dashT -= dt; p.vx = p.face*700; p.vy = 0;
    if (Math.random() < .8) parts.push({x:p.x,y:p.y-20,vx:-p.face*60,vy:rnd(-30,30),life:.3,max:.3,col:'#8ef',size:6});
  } else {
    p.vx += (dir*speed - p.vx) * Math.min(1, dt*14);
    p.vy += GRAV*dt;
  }
  if (pressed.jump && p.jumps < 2) { p.vy = p.jumps ? -560 : -640; p.jumps++; p.squash = .7; burst(p.x,p.y,8,'#cfe',120,.35,3); }
  if (pressed.dash && p.dashCd <= 0) { p.dashT = .16; p.dashCd = 1.1; p.inv = Math.max(p.inv,.25); }
  if (pressed.shield && p.shieldCd <= 0) { p.shieldT = 1.6; p.shieldCd = 5; }
  if (keys.shoot && p.shootCd <= 0) {
    p.shootCd = .14;
    const tx = B.x - p.x, ty = (B.y) - (p.y-24), d = Math.hypot(tx,ty) || 1;
    // aim mostly forward, nudge toward the boss so it is playable with buttons
    let ax = p.face, ay = 0;
    if (Math.sign(tx) === p.face || Math.abs(tx) < 60) { ax = tx/d; ay = ty/d; }
    bullets.push({ x:p.x+p.face*14, y:p.y-24, vx:ax*720, vy:ay*720, r:6, dmg:12, life:1.2 });
  }
  if (pressed.ult && p.ult >= 100) {
    p.ult = 0; p.ultT = 1.6; say('רגע... מה זה הדבר הזה?! 😨', 1.6); shake = 14; flash = .4; slowmo = .35;
  }
  if (p.ultT > 0) {
    p.ultT -= dt;
    if (bossHitbox(p.x, p.y-24, 1, true)) { hitBoss(140*dt, false); if (Math.random()<.5) burst(B.x+rnd(-40,40),B.y+rnd(-40,40),3,'#ffe066',300,.4,4); }
    shake = Math.max(shake, 5);
  }

  const prevY = p.y;
  p.x += p.vx*dt; p.y += p.vy*dt;
  p.onGround = false;
  if (p.vy >= 0) for (const s of surfaces()) {
    if (p.x > s.x-8 && p.x < s.x+s.w+8 && prevY <= s.y && p.y >= s.y) {
      p.y = s.y; p.vy = 0; if (!p.onGround && p.jumps) p.squash = 1.25; p.onGround = true; p.jumps = 0;
    }
  }
  p.x = Math.max(-40, Math.min(W+40, p.x));
  p.squash += (1-p.squash)*Math.min(1,dt*12);
  if (p.y > H+80) { // fell into the void
    p.lives--; say(pick(['חחחחחחח נפלת 😂','ביי ביי!','האי קטן, אמרתי לך','קפוץ קפוץ... אופס']), 2.4);
    if (p.lives <= 0) return lose();
    Object.assign(p, { x:450, y:200, vx:0, vy:0, inv:2, hp:100 });
  }
}
function hurtPlayer(d, srcX) {
  const p = P;
  if (p.inv > 0) return;
  if (p.shieldT > 0) { burst(p.x,p.y-24,10,'#7cf',200,.4,3); popText(p.x,p.y-60,'חסום!','#7cf',16); return; }

// ---------- boss ----------
const BW = 130, BH = 155;
function bossHitbox(x,y,r,beam) {
  if (beam) { // horizontal ultimate beam toward the facing side
    const dirOk = Math.sign(B.x - x) === P.face || Math.abs(B.x-x) < 60;
    return dirOk && Math.abs(B.y - y) < BH*B.scale*.5 + 40;
  }
  return Math.abs(x-B.x) < BW*B.scale/2 + r && Math.abs(y-B.y) < BH*B.scale/2 + r;
}
function hitBoss(d, popup=true) {
  if (B.dead) return;
  B.hp -= d; B.hitT = .12; B.sq = .82;
  P.ult = Math.min(100, P.ult + d*.09);
  if (popup) popText(B.x+rnd(-40,40), B.y-BH/2-10, Math.round(d), '#ffe066', 16);
  if (Math.random() < .045 && bubble.t < .5) say(pick(HURT), 1.3);
  const ph = B.hp < B.max*.33 ? 2 : B.hp < B.max*.66 ? 1 : 0;
  if (ph > B.phase) { B.phase = ph; say(PHASE_LINES[ph], 2.6); shake = 18; flash = .3; burst(B.x,B.y,40,'#ff4d6d',420,.9,5); B.atk = null; B.next = 1.2; enemyShots.length = 0; }
  if (B.hp <= 0) { B.hp = 0; B.dead = true; B.deathT = 0; enemyShots = []; minis = []; say('לא... הקפוצ\'ון... 😵', 4); slowmo = 1.2; }
}
function startAttack() {
  const list = ['spray','dive','rain','minis','aimed'];
  if (B.phase >= 1) list.push('laser','dive');
  if (B.phase >= 2) list.push('spiral','clone');
  B.atk = pick(list.filter(a => a !== B.lastAtk)); B.lastAtk = B.atk; B.atkT = 0; B.step = 0;
  if (Math.random() < .55) say(pick(TAUNTS), 2);
}
function shot(x,y,vx,vy,o={}) { enemyShots.push(Object.assign({x,y,vx,vy,r:11,emo:'😂',life:5,dmg:12,spin:rnd(-6,6),rot:0},o)); }
function updateBoss(dt) {
  const b = B;
  b.t += dt; b.hitT -= dt;
  b.sq += (1-b.sq)*Math.min(1,dt*10);
  b.scale += ((b.phase===2?1.2:1) - b.scale)*dt*2;
  if (b.dead) { b.deathT += dt; b.rot += dt*8; b.y += 60*dt; if (Math.random()<.5) burst(b.x+rnd(-60,60), b.y+rnd(-60,60), 6, pick(['#ffe066','#ff4d6d','#7cff6b']), 300, .7, 5); if (b.deathT > 3) win(); return; }
  const speedUp = 1 + b.phase*.3;
  if (!b.atk) {
    b.next -= dt*speedUp;
    b.tx = 450 + Math.sin(b.t*.7)*230; b.ty = 120 + Math.sin(b.t*1.9)*30;
    if (b.next <= 0) startAttack();
  } else {
    b.atkT += dt*speedUp;
    const a = b.atk, T = b.atkT;
    if (a === 'spray') {
      b.tx = 450; b.ty = 110;
      if (T > .6 && b.step < 3) { if (T > .6 + b.step*.55) { const n = 10 + b.phase*4, off = b.step*.3;
        for (let i=0;i<n;i++) { const ang = off + i/n*Math.PI*2; shot(b.x,b.y,Math.cos(ang)*190,Math.sin(ang)*190); } b.step++; b.sq = 1.25; } }
      if (T > 2.4) endAttack();
    } else if (a === 'aimed') {
      b.tx = P.x < 450 ? 720 : 180; b.ty = 140;
      if (T > .5 && T < 2.5 && T > .5 + b.step*.18) { b.step++; const dx=P.x-b.x, dy=P.y-24-b.y, d=Math.hypot(dx,dy)||1;
        shot(b.x,b.y,dx/d*340,dy/d*340,{emo:pick(['👟','🎒','📱']),r:13}); }
      if (T > 2.8) endAttack();
    } else if (a === 'dive') {
      if (b.step === 0) { b.tx = P.x; b.ty = 70; b.sq = 1 + Math.sin(T*40)*.08; if (T > 1) { b.step = 1; b.dx = P.x; b.dy = P.y-30; say('אני בא!!! 😤', 1); } }
      else if (b.step === 1) { b.tx = b.dx; b.ty = b.dy; b.x += (b.dx-b.x)*dt*9; b.y += (b.dy-b.y)*dt*9;
        if (Math.abs(b.y-b.dy) < 12) { b.step = 2; shake = 16; b.sq = .6; burst(b.x,b.y+60,30,'#cbb',360,.6,5);
          for (let i=0;i<8;i++) shot(b.x, b.y+40, (i-3.5)*90, -200-rnd(0,120), {emo:'🪨', r:10, grav:true}); } }
      else if (T > 2.6) endAttack();
    } else if (a === 'rain') {
      b.tx = 450 + Math.sin(T*3)*250; b.ty = 70;
      if (T < 3 && Math.random() < dt*(9+b.phase*4)) shot(rnd(ISLAND.x-120, ISLAND.x+ISLAND.w+120), -20, 0, rnd(160,260), {emo:pick(['👟','🧢','🎒','🍕','🧦']), r:13});
      if (T > 3.6) endAttack();
    } else if (a === 'minis') {
      b.tx = 450; b.ty = 100;
      if (b.step === 0 && T > .4) { b.step = 1; say('תכירו את האחים שלי 👬', 1.8);
        for (let i=0;i<3+b.phase;i++) minis.push({x:b.x,y:b.y,vx:rnd(-200,200),vy:rnd(-200,0),hp:40,t:rnd(0,6)}); }
      if (T > 1.8) endAttack();
    } else if (a === 'laser') {

      else { b.tx = b.lx + (P.x > b.lx ? 1 : -1) * (T-1.1)*120;
        if (T < 2.8 && Math.abs(P.x - b.x) < 26 && P.y > b.y) hurtPlayer(18, b.x); shake = Math.max(shake,3); }

    } else if (a === 'spiral') {

      if (T > .4 && T < 3.4 && T > .4 + b.step*.08) { b.step++; const ang = b.step*.45;
        shot(b.x,b.y,Math.cos(ang)*220,Math.sin(ang)*220,{emo:'🔥'}); shot(b.x,b.y,-Math.cos(ang)*220,-Math.sin(ang)*220,{emo:'🔥'}); }

    } else if (a === 'clone') {
      b.tx = 450; b.ty = 100;

        for (let i=0;i<6;i++) minis.push({x:b.x,y:b.y,vx:Math.cos(i)*300,vy:Math.sin(i)*300,hp:30,t:i,big:true}); }

  // touching the boss hurts

}
function endAttack() { B.atk = null; B.next = rnd(1.1, 2) - B.phase*.3; }

// ---------- loop ----------
function update(dt) {
  time += dt;
  if (bubble.t > 0) bubble.t -= dt;
  updatePlayer(dt);
  if (state !== 'play') return;
  updateBoss(dt);
  for (const s of bullets) { s.x += s.vx*dt; s.y += s.vy*dt; s.life -= dt;
    if (!B.dead && bossHitbox(s.x,s.y,s.r)) { s.life = 0; hitBoss(s.dmg); burst(s.x,s.y,5,'#ffb347',180,.3,3); }
    for (const m of minis) if (Math.hypot(m.x-s.x,m.y-s.y) < 24) { s.life = 0; m.hp -= s.dmg; burst(s.x,s.y,4,'#fff',150,.3,3); } }
  bullets = bullets.filter(s => s.life > 0);
  for (const e of enemyShots) { if (e.grav) e.vy += GRAV*.6*dt; e.x += e.vx*dt; e.y += e.vy*dt; e.life -= dt; e.rot += e.spin*dt;
    if (Math.hypot(e.x-P.x, e.y-(P.y-20)) < e.r+14) { hurtPlayer(e.dmg, e.x); e.life = 0; }
    if (P.ultT > 0 && Math.abs(e.y-(P.y-24)) < 40 && Math.sign(e.x-P.x) === P.face) e.life = 0;
    if (e.x < -60 || e.x > W+60 || e.y > H+60 || e.y < -200) e.life = 0; }
  enemyShots = enemyShots.filter(e => e.life > 0);
  for (const m of minis) { m.t += dt; const dx=P.x-m.x, dy=P.y-24-m.y, d=Math.hypot(dx,dy)||1;
    m.vx += dx/d*420*dt; m.vy += dy/d*420*dt; m.vx *= .985; m.vy *= .985; m.x += m.vx*dt; m.y += m.vy*dt;
    if (d < 26) { hurtPlayer(12, m.x); m.hp = 0; }
    if (P.ultT > 0 && Math.abs(m.y-(P.y-24)) < 50 && Math.sign(m.x-P.x) === P.face) m.hp = 0;
    if (m.hp <= 0) { burst(m.x,m.y,14,'#ffe066',240,.5,4); popText(m.x,m.y-20,pick(['פוף!','ביי','😵']),'#fff',14); P.ult = Math.min(100,P.ult+6); } }
  minis = minis.filter(m => m.hp > 0);
  for (const q of parts) { q.x += q.vx*dt; q.y += q.vy*dt; q.vy += 300*dt; q.life -= dt; }
  parts = parts.filter(q => q.life > 0);
  for (const t of texts) { t.y -= 40*dt; t.life -= dt; }
  texts = texts.filter(t => t.life > 0);
  shake = Math.max(0, shake - dt*40); flash = Math.max(0, flash-dt);
  for (const r of rocks) { r.x -= r.v*dt; if (r.x < -30) { r.x = W+30; r.y = 60+Math.random()*380; } }
}

// ---------- drawing ----------
function drawIsland(s, big) {

  ctx.fillStyle = p.hitT > 0 ? '#fff' : '#3a7bff'; ctx.fillRect(-11,-36,22,24);
  ctx.fillStyle = '#ffd6a8'; ctx.beginPath(); ctx.arc(0,-46,11,0,7); ctx.fill();
  ctx.fillStyle = '#d33'; ctx.fillRect(-12,-55,24,6); // headband
  ctx.fillStyle = '#d33'; ctx.beginPath(); ctx.moveTo(-12,-54); ctx.lineTo(-24,-50+Math.sin(time*15)*4); ctx.lineTo(-12,-50); ctx.fill();
  ctx.fillStyle = '#000'; ctx.fillRect(3,-48,3,3);

    const g = ctx.createLinearGradient(0,y-w,0,y+w); g.addColorStop(0,'rgba(255,200,0,0)'); g.addColorStop(.5,'#fff'); g.addColorStop(1,'rgba(255,120,0,0)');

function drawBoss() {
  const b = B, s = b.scale;

  ctx.fillStyle = aura; roundRect(-BW/2-5,-BH/2-5,BW+10,BH+10,26); ctx.fill();
  ctx.shadowBlur = 0;

  if (b.phase === 2) { ctx.fillStyle = `rgba(255,0,0,${.18+Math.sin(time*8)*.08})`; ctx.fillRect(-BW/2,-BH/2,BW,BH); }

  }
  ctx.restore();
  if (b.atk === 'laser' && b.step === 1 && b.atkT < 2.8) {
    const w = 18 + Math.sin(time*80)*5;
    ctx.fillStyle = 'rgba(255,0,60,.35)'; ctx.fillRect(b.x-w*1.6, b.y, w*3.2, H);
    ctx.fillStyle = '#fff'; ctx.fillRect(b.x-w/3, b.y, w*.66, H);
  } else if (b.atk === 'laser') {
    ctx.strokeStyle = 'rgba(255,0,60,.5)'; ctx.setLineDash([8,8]); ctx.beginPath(); ctx.moveTo(b.x,b.y); ctx.lineTo(b.x,H); ctx.stroke(); ctx.setLineDash([]);

function draw() {
  ctx.save();

  // empty void sky
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0, B.phase===2 ? '#2a0610' : '#0d1030'); g.addColorStop(1, B.phase===2 ? '#120003' : '#03040c');

  ctx.font = '20px serif'; ctx.textAlign = 'left'; ctx.fillText('❤️'.repeat(Math.max(0,P.lives)), 16, H-44);
}

function updateButtons() {
  cdEls.dash.style.height = Math.max(0, P.dashCd/1.1*100) + '%';
  cdEls.shield.style.height = Math.max(0, P.shieldCd/5*100) + '%';
  cdEls.ult.style.height = (100 - P.ult) + '%';
  ultBtn.classList.toggle('ready', P.ult >= 100);
}

// ---------- states ----------
const ov = document.getElementById('overlay'), ovTitle = document.getElementById('ovTitle'), ovText = document.getElementById('ovText'), startBtn = document.getElementById('startBtn');
function start() { reset(); state = 'play'; ov.style.display = 'none'; }
function lose() { state = 'over'; setTimeout(() => {
  ovTitle.textContent = 'הפסדת 💀'; ovText.innerHTML = 'הוא אפילו לא קם מהכיסא.<br><i>"למה שלא תבין את זה?"</i>'; startBtn.textContent = 'עוד פעם!'; ov.style.display = 'flex'; }, 900); }
function win() { if (state !== 'play') return; state = 'won';
  ovTitle.textContent = 'ניצחת!!! 🏆'; ovText.innerHTML = 'הבוס עם הקפוצ\'ון הובס.<br>הוא חוזר לאוטובוס לחשוב על החיים שלו. 🚌'; startBtn.textContent = 'שוב פעם'; ov.style.display = 'flex'; }
startBtn.addEventListener('click', start);

reset(); state = 'menu';
let last = performance.now();
function frame(now) {
  let dt = Math.min(.033, (now-last)/1000); last = now;
  if (slowmo > 0) { slowmo -= dt; dt *= .35; }
  if (state === 'play' || state === 'over') update(dt); else { time += dt; }
  for (const k in pressed) pressed[k] = false;
  draw(); updateButtons();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
