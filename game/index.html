<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>קרב על האי</title>
<style>
  :root { --bg:#05060f; --fg:#f4f4ff; --accent:#8dff7a; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  html,body { margin:0; height:100%; background:radial-gradient(ellipse at 50% 30%, #161a3a 0%, #05060f 70%); color:var(--fg);
              font-family:system-ui,"Segoe UI",Arial,sans-serif; overflow:hidden; touch-action:none; }
  #wrap { display:flex; flex-direction:column; height:100%; height:100dvh; position:relative; }
  #stage { flex:1; position:relative; min-height:0; display:flex; align-items:center; justify-content:center; padding:6px; }
  canvas { width:100%; height:100%; object-fit:contain; display:block; }
  #pad { display:flex; justify-content:space-between; align-items:flex-end; gap:8px; padding:8px 12px calc(12px + env(safe-area-inset-bottom)); direction:ltr; }
  .group { display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; }
  .group.right { justify-content:flex-end; max-width:62%; }
  button { font:inherit; color:var(--fg); border:1px solid rgba(255,255,255,.18); border-radius:50%;
           width:64px; height:64px; font-size:22px; font-weight:700; padding:0; position:relative; overflow:hidden; touch-action:none;
           background:radial-gradient(circle at 35% 25%, rgba(255,255,255,.28), rgba(255,255,255,.04) 45%, rgba(0,0,0,.25) 100%), linear-gradient(160deg,#2b3270,#141838);
           box-shadow:0 6px 16px rgba(0,0,0,.5), inset 0 -3px 8px rgba(0,0,0,.4), inset 0 2px 2px rgba(255,255,255,.15);
           transition:transform .06s, box-shadow .06s; }
  button.on { transform:scale(.9); box-shadow:0 2px 8px rgba(0,0,0,.5), 0 0 18px rgba(141,255,122,.55), inset 0 2px 10px rgba(0,0,0,.5); }
  button small { display:block; font-size:10px; opacity:.75; font-weight:600; margin-top:-2px; }
  button .cd { position:absolute; left:0; bottom:0; width:100%; background:rgba(5,6,20,.72); pointer-events:none; }
  [data-k="shoot"] { width:78px; height:78px; font-size:28px; background:radial-gradient(circle at 35% 25%, rgba(255,255,255,.35), rgba(255,255,255,.05) 45%, rgba(0,0,0,.25) 100%), linear-gradient(160deg,#ff8a3d,#b0281f); }
  #ult { background:radial-gradient(circle at 35% 25%, rgba(255,255,255,.35), rgba(255,255,255,.05) 45%, rgba(0,0,0,.25) 100%), linear-gradient(160deg,#ffd84a,#a8640a); }
  #ult.ready { animation:pulse .7s infinite alternate; }
  @keyframes pulse { from { box-shadow:0 0 10px #ffcf3a, 0 6px 16px rgba(0,0,0,.5); } to { box-shadow:0 0 30px #ff9d00, 0 0 50px rgba(255,160,0,.5); } }
  #overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
             background:radial-gradient(ellipse at center, rgba(10,8,30,.55), rgba(3,3,10,.88)); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px); padding:20px; gap:12px; }
  #overlay h1 { margin:0; font-size:clamp(30px,7vw,56px); font-weight:900; letter-spacing:.5px;
                background:linear-gradient(180deg,#fff 10%,#ffe066 45%,#ff6a3d 95%); -webkit-background-clip:text; background-clip:text; color:transparent;
                filter:drop-shadow(0 4px 0 #6b1a0a) drop-shadow(0 0 22px rgba(255,120,40,.6)); }
  #overlay p { margin:0; max-width:520px; line-height:1.6; opacity:.92; font-size:clamp(14px,2.6vw,17px); }
  .pick { display:flex; gap:14px; }
  #overlay .card { width:auto; height:auto; border-radius:18px; padding:10px 14px 8px; display:flex; flex-direction:column; align-items:center; gap:3px;
                   background:rgba(255,255,255,.06); border:2px solid rgba(255,255,255,.14); box-shadow:none; font-size:15px; }
  #overlay .card img { width:86px; height:86px; border-radius:50%; object-fit:cover; object-position:30% 30%; border:3px solid #4a4f80; transition:transform .2s; }
  #overlay .card b { font-size:17px; } #overlay .card small { font-size:11px; opacity:.75; margin:0; }
  #overlay .card.sel { border-color:#ffcf3a; background:rgba(255,207,58,.13); box-shadow:0 0 26px rgba(255,180,40,.45); }
  #overlay .card.sel img { border-color:#ff3d6e; animation:wob 1.2s infinite ease-in-out; }
  @keyframes wob { 50% { transform:rotate(-7deg) scale(1.06); } }
  #overlay .portrait { width:120px; height:120px; border-radius:50%; padding:4px; background:conic-gradient(#ff3d6e,#ffcf3a,#7a5cff,#ff3d6e);
                       animation:spin 3s linear infinite; box-shadow:0 0 40px rgba(255,61,110,.6); }
  #overlay .portrait img { width:100%; height:100%; border-radius:50%; object-fit:cover; display:block; animation:spin 3s linear infinite reverse; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #overlay .start { width:auto; height:58px; border-radius:30px; padding:0 34px; font-size:21px;
                    background:linear-gradient(180deg,#ff6b8a,#e0234f); border:2px solid #ffb3c4; box-shadow:0 6px 0 #7d0c25, 0 0 30px rgba(255,61,110,.5); }
  #overlay .start:active { transform:translateY(4px); box-shadow:0 2px 0 #7d0c25; }
  .keys { font-size:12px; opacity:.55; }
  @media (max-width:600px) { button { width:54px; height:54px; font-size:19px; } [data-k="shoot"] { width:66px; height:66px; } }
  #gear { position:absolute; top:12px; left:12px; width:44px; height:44px; font-size:22px; z-index:5; }
  #settings { position:absolute; inset:0; z-index:6; display:flex; align-items:center; justify-content:center; background:rgba(3,3,12,.6);
              backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); }
  #settings[hidden] { display:none; }
  .panel { width:min(340px, 92%); padding:22px 22px 18px; border-radius:22px; background:linear-gradient(170deg,#232a5c,#11142e);
           border:1px solid rgba(255,255,255,.15); box-shadow:0 20px 50px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.12); }
  .panel h2 { margin:0 0 14px; font-size:22px; text-align:center; }
  .opt { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 4px 6px; font-size:17px; font-weight:600; cursor:pointer; }
  .switch { appearance:none; -webkit-appearance:none; width:52px; height:30px; border-radius:15px; background:#3a3f6a; position:relative; cursor:pointer;
            transition:background .2s; margin:0; flex:none; box-shadow:inset 0 2px 4px rgba(0,0,0,.4); }
  .switch::after { content:''; position:absolute; top:3px; right:3px; width:24px; height:24px; border-radius:50%; background:#fff; transition:right .2s; box-shadow:0 2px 4px rgba(0,0,0,.4); }
  .switch:checked { background:linear-gradient(90deg,#2fbf4a,#8dff7a); }
  .switch:checked::after { right:25px; }
  .vol { width:100%; accent-color:#8dff7a; margin:2px 0 8px; direction:ltr; }
  .vol:disabled { opacity:.35; }
  .panel .done { display:block; width:100%; height:48px; border-radius:24px; margin-top:12px; font-size:18px;
                 background:linear-gradient(180deg,#ff6b8a,#e0234f); border:2px solid #ffb3c4; box-shadow:0 5px 0 #7d0c25; }
  .panel .test { display:block; width:100%; height:42px; border-radius:21px; margin-top:8px; font-size:16px; }
  .panel .status { text-align:center; font-size:13px; margin-top:8px; min-height:18px; line-height:1.5; }
  .panel .hint { text-align:center; font-size:12px; opacity:.5; margin-top:10px; }
  @media (max-width:600px) { #gear { width:38px; height:38px; font-size:18px; } }
  #fs { position:absolute; top:62px; left:12px; width:44px; height:44px; font-size:20px; z-index:5; }
  #fs[hidden] { display:none; }
  .rotate { display:none; align-items:center; gap:8px; padding:8px 14px; border-radius:16px; background:rgba(141,255,122,.12); border:1px solid rgba(141,255,122,.35); font-size:14px; font-weight:600; }
  .rotate span { display:inline-block; font-size:22px; animation:turn 1.8s ease-in-out infinite; }
  @keyframes turn { 0%,25% { transform:rotate(0); } 55%,100% { transform:rotate(-90deg); } }
  @media (orientation:portrait) and (pointer:coarse) { .rotate { display:flex; } }

  /* phone held sideways: the game fills the screen and the buttons float over it */
  @media (orientation:landscape) and (max-height:560px) {
    #stage { padding:0; }
    #pad { position:absolute; left:0; right:0; bottom:0; pointer-events:none; align-items:flex-end;
           padding:0 calc(12px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left)); }
    #pad button { pointer-events:auto; opacity:.88; width:56px; height:56px; font-size:20px; }
    #pad [data-k="left"], #pad [data-k="right"] { width:66px; height:66px; font-size:24px; }
    #pad [data-k="jump"] { width:64px; height:64px; }
    #pad [data-k="shoot"] { width:76px; height:76px; font-size:28px; }
    .group { flex-wrap:nowrap; }
    .group.right { display:grid; max-width:none; gap:8px; align-items:center; justify-items:center;
                   grid-template-columns:repeat(3, auto); grid-template-areas:"dash shield ult" ". jump shoot"; }
    #b_dash { grid-area:dash; } #b_shield { grid-area:shield; } #ult { grid-area:ult; }
    #pad [data-k="jump"] { grid-area:jump; } #pad [data-k="shoot"] { grid-area:shoot; }
    #gear { top:calc(8px + env(safe-area-inset-top)); left:calc(8px + env(safe-area-inset-left)); width:40px; height:40px; font-size:18px; }
    #fs { top:calc(54px + env(safe-area-inset-top)); left:calc(8px + env(safe-area-inset-left)); width:40px; height:40px; font-size:18px; }
    #overlay { gap:6px; padding:10px; }
    #overlay .card { padding:5px 12px 4px; flex-direction:row; gap:8px; } #overlay .card img { width:46px; height:46px; } #overlay .card small { display:none; }
    #overlay h1 { font-size:30px; }
    #overlay p { font-size:13px; line-height:1.4; }
    #overlay .start { height:46px; font-size:18px; }
    .keys { display:none; }
    .panel { max-height:calc(100% - 16px); overflow:auto; padding:12px 18px; }
    .panel h2 { margin-bottom:4px; font-size:18px; }
    .opt { padding:6px 4px 2px; }
    .panel .test { height:36px; margin-top:4px; } .panel .done { height:40px; margin-top:8px; } .panel .hint { display:none; }
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="c"></canvas>
    <button id="gear" aria-label="הגדרות">⚙️</button>
    <button id="fs" aria-label="מסך מלא" hidden>⛶</button>
    <div id="settings" hidden>
      <div class="panel">
        <h2>⚙️ הגדרות</h2>
        <label class="opt"><span>🎵 מוזיקה</span><input type="checkbox" class="switch" id="optMusic"></label>
        <input type="range" class="vol" id="volMusic" min="0" max="100" aria-label="עוצמת מוזיקה">
        <label class="opt"><span>🔊 אפקטים קוליים</span><input type="checkbox" class="switch" id="optSfx"></label>
        <input type="range" class="vol" id="volSfx" min="0" max="100" aria-label="עוצמת אפקטים">
        <label class="opt"><span>🗣️ קולות של הבוס</span><input type="checkbox" class="switch" id="optVoice"></label>
        <input type="range" class="vol" id="volVoice" min="0" max="100" aria-label="עוצמת קולות">
        <button class="test" id="testSound">🔈 בדיקת סאונד</button>
        <div class="status" id="soundStatus"></div>
        <button class="done" id="closeSettings">המשך</button>
        <div class="hint">המשחק בהשהיה · Esc לפתוח/לסגור</div>
      </div>
    </div>
    <div id="overlay">
      <div class="pick" id="pick">
        <button class="card" data-boss="aviv"><img alt=""><b>אביב</b><small>קול של ילד מסכן 🥺</small></button>
        <button class="card" data-boss="ramhik"><img alt=""><b>רמהיק</b><small>קול רוסי כבד 🐻</small></button>
      </div>
      <h1 id="ovTitle">קרב על האי המעופף</h1>
      <p id="ovText">בעולם ריק לגמרי מרחף אי קטן אחד. ועליו אתה.<br><span id="blurb"></span><br>אל תיפול מהאי. תביס אותו.</p>
      <div class="rotate"><span>📱</span> סובב את הטלפון לרוחב – ככה הכי כיף</div>
      <button class="start" id="startBtn">יאללה לקרב!</button>
      <div class="keys">מקלדת: ← → זזים · ↑ קפיצה · Z יריה · X דאש · C מגן · V אולטי</div>
    </div>
  </div>
  <div id="pad">
    <div class="group">
      <button data-k="left">◀</button>
      <button data-k="right">▶</button>
    </div>
    <div class="group right">
      <button data-k="dash" id="b_dash">💨<small>דאש</small><span class="cd"></span></button>
      <button data-k="shield" id="b_shield">🛡️<small>מגן</small><span class="cd"></span></button>
      <button data-k="ult" id="ult">⚡<small>אולטי</small><span class="cd"></span></button>
      <button data-k="jump">⤒<small>קפיצה</small></button>
      <button data-k="shoot">🔥<small>יריה</small></button>
    </div>
  </div>
</div>

// ---------- voices: the browser's own speech synthesis ----------
let voices = [];
const canSpeak = 'speechSynthesis' in window;
function loadVoices() { try { voices = speechSynthesis.getVoices(); } catch (e) {} }
if (canSpeak) { loadVoices(); try { speechSynthesis.addEventListener('voiceschanged', loadVoices); } catch (e) { speechSynthesis.onvoiceschanged = loadVoices; } }
function hush() { if (canSpeak) try { speechSynthesis.cancel(); } catch (e) {} }
function speak(text, who = boss) {
  if (!canSpeak || !settings.voice) return false;
  const clean = text.replace(/[\p{Extended_Pictographic}️‍]/gu, '').replace(/\.{2,}/g, ', ').trim();
  if (!clean) return false;
  const v = who.voice;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(clean);
    u.lang = v.lang; u.pitch = v.pitch; u.rate = v.rate; u.volume = settings.voiceVol;
    const match = voices.filter(x => v.langs.some(l => x.lang.toLowerCase().replace('_', '-').startsWith(l)));
    const pick = match.find(x => v.prefer.test(x.name)) || match[0];
    if (pick) u.voice = pick;
    speechSynthesis.speak(u);
    return true;
  } catch (e) { return false; }
}

const BW = 108, BH = 129, BODY = 58;
function bossHitbox(x,y,r,beam) {
  const s = B.scale, cy = B.y + BODY/2*s, hh = (BH/2 + BODY/2)*s;
  if (beam) { // horizontal ultimate beam toward the facing side
    const dirOk = Math.sign(B.x - x) === P.face || Math.abs(B.x-x) < 60;
    return dirOk && Math.abs(cy - y) < hh + 40;
  }
  return Math.abs(x-B.x) < BW*s/2 + 10 + r && Math.abs(y-cy) < hh + r;
}

  B.hp -= d; B.hitT = .1; B.sq = .84;

  if (popup) popText(B.x+rnd(-40,40), B.y-BH/2-10, Math.round(d), '#ffe066', 17);
  if (Math.random() < .045 && bubble.t < .5) say(pick(boss.hurt), 1.3);

function updateButtons() {
  cdEls.dash.style.height = Math.max(0, P.dashCd/1.1*100) + '%';
  cdEls.shield.style.height = Math.max(0, P.shieldCd/5*100) + '%';
  cdEls.ult.style.height = (100 - P.ult) + '%';
  ultBtn.classList.toggle('ready', P.ult >= 100);
}

// ---------- states ----------
const ov = document.getElementById('overlay'), ovTitle = document.getElementById('ovTitle'), ovText = document.getElementById('ovText'), startBtn = document.getElementById('startBtn');
function start() { initAudio(); SFX.click(); if (matchMedia('(pointer:coarse)').matches && !isFs()) goFullscreen(); reset(); state = 'play'; ov.style.display = 'none'; Music.intensity = 0; musicPlay('battle'); say(boss.intro, 2.6); }
function addUlt(v) { const was = P.ult; P.ult = Math.min(100, P.ult + v); if (was < 100 && P.ult >= 100) SFX.ultReady(); }
function lose() { state = 'over'; Music.mode = null; SFX.lose(); setTimeout(() => { musicPlay('menu');
  ovTitle.textContent = 'הפסדת 💀'; ovText.innerHTML = boss.lose; startBtn.textContent = 'עוד פעם!'; ov.style.display = 'flex'; }, 900); }
function win() { if (state !== 'play') return; state = 'won'; SFX.win(); setTimeout(() => { if (state === 'won') musicPlay('menu'); }, 1800);
  ovTitle.textContent = 'ניצחת!!! 🏆'; ovText.innerHTML = boss.win; startBtn.textContent = 'שוב פעם'; ov.style.display = 'flex'; }
startBtn.addEventListener('click', start);

// ---------- boss picker ----------
const cards = [...document.querySelectorAll('#pick .card')];
function selectBoss(id) {
  boss = BOSSES[id] || BOSSES.aviv; bossImg = boss.img; settings.boss = boss.id; saveSettings();
  cards.forEach(c => c.classList.toggle('sel', c.dataset.boss === boss.id));
  document.getElementById('blurb').innerHTML = boss.blurb;
}
cards.forEach(c => {
  c.querySelector('img').src = BOSSES[c.dataset.boss].src;
  c.addEventListener('click', () => { initAudio(); selectBoss(c.dataset.boss); SFX.click(); if (!speak(lineOf(boss.intro)[0])) SFX.talk(8); });
});
selectBoss(boss.id);

// ---------- settings panel ----------
const setEl = document.getElementById('settings'), optMusic = document.getElementById('optMusic'), optSfx = document.getElementById('optSfx'),
      volMusic = document.getElementById('volMusic'), volSfx = document.getElementById('volSfx'),
      optVoice = document.getElementById('optVoice'), volVoice = document.getElementById('volVoice');
let paused = false;
function syncSettingsUI() {
  optMusic.checked = settings.music; optSfx.checked = settings.sfx; optVoice.checked = settings.voice; volVoice.value = Math.round(settings.voiceVol*100); volVoice.disabled = !settings.voice;
  volMusic.value = Math.round(settings.musicVol*100); volSfx.value = Math.round(settings.sfxVol*100);
  volMusic.disabled = !settings.music; volSfx.disabled = !settings.sfx;
}
function openSettings() { initAudio(); hush(); syncSettingsUI(); updateSoundStatus(); setEl.hidden = false; paused = true; for (const k in keys) keys[k] = false; document.querySelectorAll('#pad .on').forEach(b => b.classList.remove('on')); }
function closeSettings() { setEl.hidden = true; paused = false; SFX.click(); }
function settingChanged() {
  settings.music = optMusic.checked; settings.sfx = optSfx.checked;
  settings.musicVol = volMusic.value/100; settings.sfxVol = volSfx.value/100;
  settings.voice = optVoice.checked; settings.voiceVol = volVoice.value/100; volVoice.disabled = !settings.voice;
  volMusic.disabled = !settings.music; volSfx.disabled = !settings.sfx;
  applyVolumes(); saveSettings();
}
optMusic.addEventListener('change', () => { settingChanged(); updateSoundStatus(); }); optSfx.addEventListener('change', () => { settingChanged(); SFX.click(); updateSoundStatus(); });
optVoice.addEventListener('change', () => { settingChanged(); if (settings.voice) speak(lineOf(boss.intro)[0]); else hush(); });
volVoice.addEventListener('input', settingChanged); volVoice.addEventListener('change', () => speak(lineOf(boss.intro)[0]));
volMusic.addEventListener('input', settingChanged); volSfx.addEventListener('input', settingChanged); volSfx.addEventListener('change', () => SFX.shoot());
document.getElementById('gear').addEventListener('click', e => { e.stopPropagation(); setEl.hidden ? openSettings() : closeSettings(); });
document.getElementById('closeSettings').addEventListener('click', closeSettings);
setEl.addEventListener('pointerdown', e => { if (e.target === setEl) closeSettings(); });
addEventListener('keydown', e => { if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') setEl.hidden ? openSettings() : closeSettings(); });
// browsers only allow sound after a tap, so the menu music starts on the first one
// (Safari only counts some of these events as a real tap, so listen to all of them, and keep retrying until the sound is running)
const firstGesture = () => { initAudio(); if (!Music.mode && state === 'menu') musicPlay('menu'); };
for (const ev of ['pointerdown', 'pointerup', 'touchend', 'click', 'keydown']) addEventListener(ev, firstGesture, true);
function updateSoundStatus() {
  const el = document.getElementById('soundStatus'); if (!el) return;
  if (!ac) el.textContent = 'הסאונד עוד לא הופעל – לחץ על בדיקת סאונד';
  else if (ac.state !== 'running') el.textContent = '⚠️ הדפדפן חוסם את הסאונד – לחץ על בדיקת סאונד';
  else if (!settings.music && !settings.sfx && !settings.voice) el.textContent = '🔇 הכל כבוי';
  else if (settings.voice && !canSpeak) el.textContent = '⚠️ הדפדפן הזה לא תומך בקולות של הבוס';
  else el.innerHTML = '✅ הסאונד פעיל<br><span style="opacity:.6">לא שומע? בדוק את עוצמת השמע של המכשיר</span>';
}
document.getElementById('testSound').addEventListener('click', () => {
  initAudio(); const was = settings.sfx; settings.sfx = true; applyVolumes(); SFX.win(); settings.sfx = was;
  if (settings.voice) setTimeout(() => speak(lineOf(boss.intro)[0]), 900);
  setTimeout(applyVolumes, 1500); setTimeout(updateSoundStatus, 150);
});
document.addEventListener('visibilitychange', () => {
  if (silentEl) document.hidden ? silentEl.pause() : silentEl.play().catch(() => {});
  if (ac) document.hidden ? ac.suspend() : ac.resume();
  if (document.hidden) hush();
});

reset(); state = 'menu';
let last = performance.now();
function frame(now) {
  let dt = Math.min(.033, (now-last)/1000); last = now;
  if (paused) { for (const k in pressed) pressed[k] = false; draw(); requestAnimationFrame(frame); return; }
  if (hitstop > 0) { hitstop -= dt; dt = 0; }
  if (slowmo > 0) { slowmo -= dt; dt *= .35; }
  ambient(dt);
  if (state === 'play' || state === 'over') update(dt);
  else { time += dt; for (const q of parts) { q.x += q.vx*dt; q.y += q.vy*dt; q.life -= dt; } parts = parts.filter(q => q.life > 0); }
  for (const k in pressed) pressed[k] = false;
  draw(); updateButtons();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
