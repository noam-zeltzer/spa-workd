name: Build Android app

# The APK is built here rather than locally: GitHub's ubuntu runners ship the
# Android SDK and can reach Google's Maven repository.
on:
  push:
    branches: [claude/minimalist-todo-app-48j48h, main]
    paths-ignore: ['README.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The runner image already ships the Android SDK with its licences
      # accepted, so the build uses that directly. It used to run
      # android-actions/setup-android, which broke on 2026-09-15: that action
      # installs the legacy "tools" package, and Google has withdrawn it from
      # the SDK repository, so sdkmanager exits 1 and the job dies before the
      # build starts.
      - name: Locate the Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "No Android SDK on this runner (ANDROID_SDK_ROOT/ANDROID_HOME unset)." >&2
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "Using $SDK"
          ls "$SDK/platforms" || true

      - name: Install dependencies
        run: npm ci

      - name: Collect the web app and sync Capacitor
        run: |
          node tools/sync-www.mjs
          npx cap sync android

      # Written outside the repository checkout so it can never be committed.
      # The secret is read through the environment rather than interpolated
      # into the script, and the step no-ops when it is absent.
      - name: Restore the signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "No signing key configured; falling back to the debug key."
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/spa-workd.jks"
          echo "SPA_KEYSTORE=$RUNNER_TEMP/spa-workd.jks" >> "$GITHUB_ENV"
          echo "Signing key restored."

      - name: Build the APK
        working-directory: android
        env:
          SPA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SPA_KEY_ALIAS: spaworkd
          SPA_VERSION_CODE: ${{ github.run_number }}
          SPA_VERSION_NAME: 1.${{ github.run_number }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Name it after the run
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
             "dist/spa-workd-${{ github.run_number }}.apk"
          if [ -z "$SPA_KEYSTORE" ]; then
            echo "::warning::Built with the debug key — ANDROID_KEYSTORE_BASE64 is not set, so this build will not install over a signed one."
          fi

      # A certificate fingerprint is public information, so pinning it here is
      # safe — and it turns "the secret was probably picked up" into something
      # the build proves on every run.
      - name: Check which key signed it
        run: |
          EXPECTED=bedebedb4c446f1ca3eaad03130e1e23372256150f6ceca980575f4852ab9b04
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::warning::apksigner not found; signature not verified."
            exit 0
          fi
          ACTUAL=$("$APKSIGNER" verify --print-certs "dist/spa-workd-${{ github.run_number }}.apk" \
            | grep -i 'certificate SHA-256 digest' | head -1 | awk '{print $NF}')
          echo "signed by: $ACTUAL"
          if [ -z "$SPA_KEYSTORE" ]; then
            echo "::warning::Debug-signed: this build will not install over a signed one."
            exit 0
          fi
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "Signed by the wrong key. Expected $EXPECTED" >&2
            exit 1
          fi
          echo "Correctly signed with the spa workd release key."

      - uses: actions/upload-artifact@v4
        with:
          name: spa-workd-apk
          path: dist/*.apk

      # A release gives a plain download link that works in a phone browser,
      # which an Actions artifact does not.
      - name: Publish the download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: spa workd — Android build ${{ github.run_number }}
          body: |
            Install on an Android phone: download the `.apk` below, tap it, and
            allow installing from this source if prompted. It installs straight
            over an earlier signed build, keeping your tasks.

            Version 1.${{ github.run_number }}, built from `${{ github.sha }}`.
          files: dist/*.apk
